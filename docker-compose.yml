version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: smart-dashboard-nginx
    ports:
      - "80:80"
      - "443:443"  # для PWA HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
