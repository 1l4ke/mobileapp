version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: smart-dashboard-pwa
    ports:
      - "8080:80"
    volumes:
      # Для разработки: монтируем файлы для hot-reload
      - ./public:/usr/share/nginx/html/public:ro
      - ./src:/usr/share/nginx/html/src:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - pwa-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pwa-network:
    driver: bridge
    name: smart-dashboard-network